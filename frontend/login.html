<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CreateFlowX (CFX)</title>
  
  <!-- Remix Icons for modern design icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
  
  <!-- CSS Styling Files -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link rel="stylesheet" href="css/layouts.css">
  
  <style>
    /* Custom override styles for auth pages */
    .top-bar {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      display: flex;
      gap: var(--space-sm);
      z-index: 100;
    }
    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }
    .modal-content {
      width: 100%;
      max-width: 480px;
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }
    .modal-backdrop.active .modal-content {
      transform: translateY(0);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Top Utilities (Theme Toggler) -->
  <div class="top-bar">
    <button class="theme-toggle" onclick="auth.toggleTheme()" aria-label="Toggle theme">
      <i class="ri-sun-line"></i>
    </button>
  </div>

  <div class="auth-wrapper">
    <!-- Glowing decorative backgrounds -->
    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>

    <div class="auth-container">
      <!-- Brand Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <!-- CFX Inline SVG Logo -->
          <svg width="40" height="40" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M70 15 C35 15, 15 35, 15 50 C15 65, 35 85, 70 85 L90 85 L90 73 L70 73 C45 73, 30 63, 30 50 C30 37, 45 27, 70 27 L90 27 L90 15 Z" fill="url(#logoBlueGrad)" />
            <path d="M85 35 L120 35 L120 47 L97 47 L97 55 L115 55 L115 65 L97 65 L97 85 L85 85 Z" fill="url(#logoBlueGrad)" />
            <path d="M125 15 L140 15 L168 52 L195 15 L210 15 L175 62 L175 85 L162 85 L162 62 Z" fill="url(#logoPurpleGrad)" />
            <defs>
              <linearGradient id="logoBlueGrad" x1="15" y1="15" x2="120" y2="85" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="100%" stop-color="#0082ff" />
              </linearGradient>
              <linearGradient id="logoPurpleGrad" x1="125" y1="15" x2="210" y2="85" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#7b2cbf" />
                <stop offset="100%" stop-color="#c77dff" />
              </linearGradient>
            </defs>
          </svg>
          <span style="font-weight: 800; font-family: var(--font-heading);">
            Create<span class="text-gradient-blue" style="font-weight: 800;">Flow</span><span class="text-gradient-purple" style="font-weight: 800;">X</span>
          </span>
        </div>
        <p class="auth-subtitle">Create. Collaborate. Flow.</p>
      </div>

      <!-- Auth Form Card -->
      <div class="card glass-panel auth-card">
        <!-- Error / Success Alert Banners -->
        <div id="alert-box" class="alert alert-danger hidden">
          <i class="ri-error-warning-line"></i>
          <span id="alert-message"></span>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="email" 
              class="form-control" 
              placeholder="you@example.com" 
              required
              autocomplete="email"
            >
          </div>
          
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-sm);">
              <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
              <a href="#" onclick="openForgotModal(event)" style="font-size: 0.8rem;" class="text-muted">Forgot password?</a>
            </div>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
            <span>Sign In</span>
            <div id="btn-spinner" class="spinner hidden"></div>
          </button>
        </form>
      </div>

      <!-- Footer Info -->
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up for free</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Overlay Modal -->
  <div class="modal-backdrop" id="forgot-modal">
    <div class="card glass-panel modal-content" style="padding: var(--space-lg); border-top: 4px solid var(--accent-color); margin: var(--space-md);">
      <div class="modal-header">
        <h3 style="font-size: 1.15rem; font-weight: 700; margin: 0; color: var(--text-primary);">Reset Password</h3>
        <button class="modal-close-btn" onclick="closeForgotModal()"><i class="ri-close-line"></i></button>
      </div>
      
      <div id="modal-alert-box" class="alert alert-danger hidden" style="margin-bottom: var(--space-md);">
        <i class="ri-error-warning-line"></i>
        <span id="modal-alert-message"></span>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email" class="form-label">Registered Email</label>
          <input 
            type="email" 
            id="forgot-email" 
            class="form-control" 
            placeholder="you@example.com" 
            required
          >
        </div>
        <div class="form-group">
          <label for="forgot-new-password" class="form-label">New Password</label>
          <input 
            type="password" 
            id="forgot-new-password" 
            class="form-control" 
            placeholder="Min 6 characters" 
            required
            minlength="6"
          >
        </div>
        <div class="form-group">
          <label for="forgot-confirm-password" class="form-label">Confirm New Password</label>
          <input 
            type="password" 
            id="forgot-confirm-password" 
            class="form-control" 
            placeholder="Confirm new password" 
            required
            minlength="6"
          >
        </div>

        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-md); padding: 0;">
          <button type="button" class="btn btn-outline" onclick="closeForgotModal()">Cancel</button>
          <button type="submit" id="forgot-submit-btn" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px;">
            <span>Reset Password</span>
            <div id="forgot-spinner" class="spinner hidden"></div>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script Imports -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Guard route: If already logged in, redirect straight to dashboard
    auth.guardAuthPages();

    // Check query parameters for notices
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const alertBox = document.getElementById("alert-box");
      const alertMessage = document.getElementById("alert-message");
      
      if (urlParams.get("expired") === "true") {
        alertBox.className = "alert alert-danger";
        alertMessage.textContent = "Your session has expired. Please log in again.";
      } else if (urlParams.get("registered") === "true") {
        alertBox.className = "alert alert-success";
        alertMessage.textContent = "Registration successful! You can now log in.";
      }
    });

    const loginForm = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const btnSpinner = document.getElementById("btn-spinner");
    const alertBox = document.getElementById("alert-box");
    const alertMessage = document.getElementById("alert-message");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      // Reset alerts
      alertBox.classList.add("hidden");
      
      // Get values
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Loading state
      submitBtn.disabled = true;
      btnSpinner.classList.remove("hidden");

      try {
        await auth.login(email, password);
        // On success, redirect to dashboard
        window.location.href = "dashboard.html";
      } catch (error) {
        // Show error message
        alertBox.className = "alert alert-danger";
        alertMessage.textContent = error.message || "Invalid credentials. Please try again.";
        alertBox.classList.remove("hidden");
      } finally {
        // Stop loading state
        submitBtn.disabled = false;
        btnSpinner.classList.add("hidden");
      }
    });

    // Forgot Password Modal functions
    function openForgotModal(e) {
      if (e) e.preventDefault();
      document.getElementById("forgot-email").value = document.getElementById("email").value || "";
      document.getElementById("forgot-new-password").value = "";
      document.getElementById("forgot-confirm-password").value = "";
      document.getElementById("modal-alert-box").classList.add("hidden");
      document.getElementById("forgot-modal").classList.add("active");
    }

    function closeForgotModal() {
      document.getElementById("forgot-modal").classList.remove("active");
    }

    const forgotForm = document.getElementById("forgot-form");
    const forgotSubmitBtn = document.getElementById("forgot-submit-btn");
    const forgotSpinner = document.getElementById("forgot-spinner");
    const modalAlertBox = document.getElementById("modal-alert-box");
    const modalAlertMessage = document.getElementById("modal-alert-message");

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      modalAlertBox.classList.add("hidden");

      const email = document.getElementById("forgot-email").value;
      const newPassword = document.getElementById("forgot-new-password").value;
      const confirmPassword = document.getElementById("forgot-confirm-password").value;

      if (newPassword !== confirmPassword) {
        modalAlertBox.className = "alert alert-danger";
        modalAlertMessage.textContent = "Passwords do not match.";
        modalAlertBox.classList.remove("hidden");
        return;
      }

      forgotSubmitBtn.disabled = true;
      forgotSpinner.classList.remove("hidden");

      try {
        const response = await api.post("/auth/forgot-password", {
          email: email,
          new_password: newPassword
        });
        
        // On success, show success message on the main login screen and close modal
        closeForgotModal();
        alertBox.className = "alert alert-success";
        alertMessage.textContent = response.message || "Password successfully reset. You can now log in.";
        alertBox.classList.remove("hidden");
        
        // Fill the email and focus password
        document.getElementById("email").value = email;
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      } catch (error) {
        modalAlertBox.className = "alert alert-danger";
        modalAlertMessage.textContent = error.message || "Failed to reset password. Please check the email address.";
        modalAlertBox.classList.remove("hidden");
      } finally {
        forgotSubmitBtn.disabled = false;
        forgotSpinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
